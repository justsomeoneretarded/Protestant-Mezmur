[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "protestant-mezmur"
version = "0.2.0"
description = "Telegram to YouTube-ready Amharic mezmur lyric videos"
requires-python = ">=3.11"
dependencies = [
    "Telethon==1.42.0", "requests==2.32.5", "Pillow==11.3.0", "PyYAML==6.0.3",
    "numpy>=1.26", "scipy>=1.13",
]

[project.optional-dependencies]
# Everything the per-song render job needs (torch is installed from the CPU index first).
render = [
    "torch==2.5.1", "transformers==4.57.3", "huggingface-hub==0.36.0", "tokenizers==0.22.1",
    "opencv-python-headless==4.10.0.84", "ddgs>=9.5", "audio-separator[cpu]>=0.39",
    "soundfile==0.13.1",
]
test = ["pytest==8.4.2", "responses==0.25.8"]

[project.scripts]
mezmur-fetch = "mezmur.fetch:main"
mezmur-song = "mezmur.song:main"

[tool.setuptools.packages.find]
include = ["mezmur*"]

[tool.setuptools.package-data]
mezmur = ["assets/*.png", "assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
