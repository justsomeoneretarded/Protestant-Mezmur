[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "protestant-mezmur"
version = "0.1.0"
description = "Resumable Telegram to Amharic lyric-video pipeline"
requires-python = ">=3.11"
dependencies = [
    "Telethon==1.42.0", "requests==2.32.5", "Pillow==11.3.0",
    "torch==2.5.1", "transformers==4.57.3", "huggingface-hub==0.36.0",
    "tokenizers==0.22.1", "numpy==2.3.5", "scipy==1.16.3",
]

[project.optional-dependencies]
vocals = ["demucs==4.0.1", "soundfile==0.13.1"]
test = ["pytest==8.4.2", "responses==0.25.8", "PyYAML==6.0.3"]

[project.scripts]
mezmur = "mezmur.pipeline:main"

[tool.setuptools.packages.find]
include = ["mezmur*"]

[tool.setuptools.package-data]
mezmur = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
