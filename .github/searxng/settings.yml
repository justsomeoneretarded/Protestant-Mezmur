# Private SearXNG used only inside the GitHub Actions job (http://localhost:8888).
use_default_settings: true
general:
  instance_name: mezmur-search
server:
  secret_key: "local-only-not-exposed"
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 0
  formats: [html, json]
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: yahoo
    disabled: false
  - name: qwant
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing images
    disabled: false
  - name: google images
    disabled: false
