name: Backing Arrangement Replay
on:
  push:
    branches: [codex/optional-backing-arrangement-and-side-thumbnail-20261103]
    paths:
      - '.github/workflows/replay-arrangement.yml'
      - '.github/scripts/replay_arrangement.py'
      - 'mezmur/**'
      - 'pyproject.toml'
permissions:
  contents: read
  actions: read
concurrency:
  group: backing-arrangement-replay
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MEZMUR_MODEL_CACHE: ${{ github.workspace }}/.model-cache
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install native renderer and music libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fluidsynth fluid-soundfont-gm
          pip install -e '.[arrange]' opencv-python-headless==4.10.0.84
      - uses: actions/cache/restore@v4
        with:
          path: .model-cache
          key: mezmur-models-v3-UVR-MDX-NET-Voc_FT.onnx
          restore-keys: mezmur-models-v3-
      - name: Install isolated vocal separator
        run: |
          python -m venv "$RUNNER_TEMP/sep"
          "$RUNNER_TEMP/sep/bin/pip" install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/sep/bin/pip" install -q 'audio-separator[cpu]>=0.39'
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/sep/bin/audio-separator" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41315143379'
          name: inputs-41315143379
          path: replay-inputs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41315143379'
          name: mezmur-30-run41315143379
          path: replay-kit
      - name: Rebuild real music clip and render native previews without publishing
        run: python .github/scripts/replay_arrangement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backing-and-thumbnail-preview
          path: .runtime/arrangement-preview/
          retention-days: 2
          compression-level: 0
