name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: FFmpeg (static, with libass)
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Rubber Band (native augmentation tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librubberband2
      - run: pip install -e '.[test,augmentation,upload]' opencv-python-headless==4.10.0.84
      - name: Validate Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/*.yml
      - run: pytest -q
