name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: FFmpeg (static, with libass)
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Native backing renderer and small test SoundFont
        timeout-minutes: 5
        run: |
          # The hosted runner's Azure HTTP mirror can stall package downloads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends fluidsynth timgm6mb-soundfont
          test -s /usr/share/sounds/sf2/TimGM6mb.sf2
          echo "MEZMUR_SOUNDFONT=/usr/share/sounds/sf2/TimGM6mb.sf2" >> "$GITHUB_ENV"
      - run: pip install -e '.[test,upload,arrange]' opencv-python-headless==4.10.0.84
      - name: Validate Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/*.yml
      - run: pytest -q
