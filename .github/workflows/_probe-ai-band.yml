name: Temporary real-song AI backing probe
on:
  push:
    branches: [feat/neural-worship-band]
    paths: ['.github/workflows/_probe-ai-band.yml', 'scripts/_probe_ai_band.py', 'scripts/setup_ai_backing.py']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      MEZMUR_MODEL_CACHE: ${{ github.workspace }}/.model-cache
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libopenblas-dev cmake g++
          pip install -e '.[arrange]'
      - uses: actions/cache@v4
        with:
          path: .ai-backing
          key: ai-band-cpp-de858d8-666ac70-linux-x64
      - name: Build pinned CPU generator and verify weights
        run: python scripts/setup_ai_backing.py
      - uses: actions/cache/restore@v4
        with:
          path: .model-cache
          key: mezmur-models-v3-UVR-MDX-NET-Voc_FT.onnx
          restore-keys: mezmur-models-v3-
      - name: Isolated separator
        run: |
          python -m venv "$RUNNER_TEMP/sep"
          "$RUNNER_TEMP/sep/bin/pip" install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/sep/bin/pip" install -q "audio-separator[cpu]>=0.39"
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/sep/bin/audio-separator" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41737296948'
          name: acoustic-song40-listening-and-timing-kit
          path: old-kit
      - name: Probe actual neural cover with unchanged real vocal
        run: python scripts/_probe_ai_band.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-worship-band-listening-probe
          path: verification/
          retention-days: 3
          compression-level: 0
