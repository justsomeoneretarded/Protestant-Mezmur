name: Temporary inspect AI engine diagnostics
on:
  push:
    branches: [feat/neural-worship-band]
    paths: ['.github/workflows/_inspect-ai.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41743167377'
          name: ai-worship-band-listening-probe
          path: probe
      - name: Show native error
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path("probe").rglob("*.log"):
              print(path, path.read_text()[-16000:])
          PY
