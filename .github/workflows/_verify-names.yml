name: Temporary original metadata check
on:
  push:
    branches: [fix/clean-lyric-search-and-coverage]
    paths: ['.github/workflows/_verify-names.yml', 'scripts/_verify_names.py']
permissions:
  contents: read
  actions: read
jobs:
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -e .
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41649241077'
          name: inputs-41649241077
          path: latest-inputs
      - name: Inspect actual source names and cleaned queries
        run: python scripts/_verify_names.py
