name: Song 29 Alignment Replay

on:
  push:
    branches: [codex/source-supported-original-audio]

permissions:
  contents: read
  actions: read

concurrency:
  group: song29-alignment-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MEZMUR_MODEL_CACHE: ${{ github.workspace }}/.model-cache
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: FFmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: .model-cache
          key: mezmur-models-v3-UVR-MDX-NET-Voc_FT.onnx
          restore-keys: mezmur-models-v3-
      - name: Install acoustic model environment
        run: |
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[render]'
      - name: Install isolated vocal separator
        run: |
          python -m venv "$RUNNER_TEMP/sep"
          "$RUNNER_TEMP/sep/bin/pip" install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/sep/bin/pip" install -q "audio-separator[cpu]>=0.39"
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/sep/bin/audio-separator" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41315143379'
          name: inputs-41315143379
          path: inputs
      - name: Replay original-audio lyric alignment without rendering or posting
        run: python .github/scripts/replay_song29.py
      - name: Keep alignment evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: song29-alignment-check-${{ github.run_id }}
          path: |
            .runtime/song29-check/alignment-report.json
            .runtime/song29-check/words.json
            .runtime/song29-check/captions/
            .runtime/song29-check/skipped.json
          if-no-files-found: ignore
          retention-days: 1
