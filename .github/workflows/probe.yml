name: Preview (temporary)
on:
  push:
    branches: [claude-probe-src]
permissions:
  contents: write
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mezmur-*
          path: art
          run-id: 40296747952
          github-token: ${{ github.token }}
      - name: FFmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Build previews
        run: |
          mkdir -p out
          for d in art/*/song-*; do
            id=$(basename "$d"); mkdir -p "out/$id"
            cp "$d"/*.txt "$d"/*.json "$d"/*.md "$d"/*.jpg "$d"/*.log "$d"/lyrics.ass "out/$id/" 2>/dev/null || true
            cp -r "$d/captions" "out/$id/" 2>/dev/null || true
            if [ -f "$d/video.mp4" ]; then
              dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$d/video.mp4")
              ls -la "$d/video.mp4" > "out/$id/video_info.txt"; ffprobe -v error -show_streams "$d/video.mp4" | grep -E "codec_name|width|height|bit_rate|duration|r_frame_rate" >> "out/$id/video_info.txt"
              for f in 0.02 0.06 0.15 0.25 0.35 0.45 0.55 0.7 0.85 0.97; do
                t=$(python3 -c "print(round($dur*$f,2))")
                ffmpeg -v error -y -ss "$t" -i "$d/video.mp4" -frames:v 1 -vf scale=960:-2 -q:v 4 "out/$id/frame_$f.jpg"
              done
              ffmpeg -v error -y -ss 40 -t 12 -i "$d/video.mp4" -vf "fps=6,scale=480:-2" -q:v 6 "out/$id/seq_%03d.jpg"
            fi
            rm -f "out/$id/words.json"
          done
          find out -name run.log -exec sh -c 'grep -v "it/s\]" "$1" | grep -v "%|" > "$1.tmp"; mv "$1.tmp" "$1"' _ {} \;
          ls -R out | head -100
      - name: Publish
        run: |
          cd out
          git init -q -b claude-probe-out
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A; git commit -qm "preview" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" claude-probe-out
