name: Temporary 45-second production AI backing verification
on:
  push:
    branches: [feat/neural-worship-band]
    paths: ['.github/workflows/_verify-ai-long.yml', 'scripts/_verify_ai_long.py']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MEZMUR_MODEL_CACHE: ${{ github.workspace }}/.model-cache
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Native audio and backing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libopenblas-dev cmake g++
          pip install -e '.[arrange]' srt
      - name: Isolated separator for generated backing only
        run: |
          python -m venv "$RUNNER_TEMP/sep"
          "$RUNNER_TEMP/sep/bin/pip" install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/sep/bin/pip" install -q "audio-separator[cpu]>=0.39"
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/sep/bin/audio-separator" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: .model-cache
          key: mezmur-models-v3-UVR-MDX-NET-Voc_FT.onnx
          restore-keys: mezmur-models-v3-
      - uses: actions/cache@v4
        with:
          path: .ai-backing
          key: ai-band-cpp-de858d8-666ac70-linux-x64
      - name: Check pinned native engine and model hashes
        run: python scripts/setup_ai_backing.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41737296948'
          name: acoustic-song40-listening-and-timing-kit
          path: old-kit
      - name: Real-song end-to-end AI backing, preserved voice and video duration
        run: python scripts/_verify_ai_long.py
      - name: Show native diagnostics on failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path("verification").rglob("*.log"):
              print(path, path.read_text()[-12000:])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-worship-band-production-listening-kit
          path: verification/
          retention-days: 3
          compression-level: 0
