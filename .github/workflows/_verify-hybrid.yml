name: Temporary hybrid audio regression
on:
  push:
    branches: [feat/hybrid-backing-arrangement]
    paths: ['.github/workflows/_verify-hybrid.yml', 'scripts/_verify_hybrid.py']
permissions:
  contents: read
  actions: read
jobs:
  song40:
    name: Hybrid backing for original song 40
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MEZMUR_MODEL_CACHE: ${{ github.workspace }}/.model-cache
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Native audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fluidsynth fluid-soundfont-gm
          pip install -e '.[arrange]' srt
      - name: Model cache
        uses: actions/cache/restore@v4
        with:
          path: .model-cache
          key: mezmur-models-v3-UVR-MDX-NET-Voc_FT.onnx
          restore-keys: mezmur-models-v3-
      - name: Isolated separator
        run: |
          python -m venv "$RUNNER_TEMP/sep"
          "$RUNNER_TEMP/sep/bin/pip" install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/sep/bin/pip" install -q "audio-separator[cpu]>=0.39"
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/sep/bin/audio-separator" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41649241077'
          name: inputs-41649241077
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41649241077'
          name: mezmur-40-run41649241077
          path: old-kit
      - name: Rebuild actual audio; preserve vocal waveform and subtitle timestamps
        run: python scripts/_verify_hybrid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-song40-listening-kit
          path: verification/
          retention-days: 3
          compression-level: 0
