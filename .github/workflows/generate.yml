name: Generate Mezmur Videos

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: How many new songs (oldest unprocessed first; each renders in parallel)
        type: choice
        options: ['3', '1', '2', '4', '5', '6', '8', '10']
        default: '3'
      message_ids:
        description: Re-make specific Telegram message IDs, comma-separated (progress is not changed)
        type: string
        default: ''
      separator:
        description: Vocal isolation model used to time the lyrics
        type: choice
        options:
          - vocals_mel_band_roformer.ckpt
          - UVR-MDX-NET-Voc_FT.onnx
          - htdemucs_ft.yaml
          - none
        default: vocals_mel_band_roformer.ckpt
      resolution:
        description: Video height
        type: choice
        options: ['1080', '720']
        default: '1080'
  push:
    branches: [main]
    paths: ['corrections/**']
  workflow_call:
    inputs:
      batch_size: {type: string, default: '3'}
      message_ids: {type: string, default: ''}
      separator: {type: string, default: vocals_mel_band_roformer.ckpt}
      resolution: {type: string, default: '1080'}

permissions:
  contents: write

concurrency:
  group: mezmur-generate
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  MEZMUR_MODEL_CACHE: ${{ github.workspace }}/.model-cache

jobs:
  fetch:
    name: Fetch songs from Telegram
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ids: ${{ steps.fetch.outputs.ids }}
      has_songs: ${{ steps.fetch.outputs.has_songs }}
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@amharicprotestantmezmurss' }}
      LYRICS_CHANNELS: ${{ vars.LYRICS_CHANNELS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check secrets
        shell: bash
        run: |
          for key in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION; do
            [ -n "${!key}" ] || { echo "::error::Missing repository secret: $key"; exit 1; }
          done
      - name: Which songs?
        id: which
        shell: bash
        env:
          INPUT_IDS: ${{ inputs.message_ids }}
        run: |
          ids="$INPUT_IDS"
          if [ -z "$ids" ] && [ "${{ github.event_name }}" = "push" ]; then
            ids=$(git diff --name-only HEAD~1 HEAD -- corrections | sed -n 's#corrections/\([0-9]\+\)\.txt#\1#p' | paste -sd, -)
            echo "Corrections changed for: ${ids:-none}"
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Install
        run: pip install -e .
      - name: Load progress
        run: python -m mezmur.state load
      - name: Download songs, nearby posts, photos; search lyrics channels
        id: fetch
        if: github.event_name != 'push' || steps.which.outputs.ids != '' || inputs.batch_size != ''
        run: |
          python -m mezmur.fetch --batch-size "${{ inputs.batch_size || '3' }}" --message-ids "${{ steps.which.outputs.ids }}" --output inputs
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.has_songs == 'true'
        with:
          name: inputs-${{ github.run_id }}
          path: inputs/
          retention-days: 2
          compression-level: 0

  song:
    name: Song ${{ matrix.id }}
    needs: fetch
    if: needs.fetch.outputs.has_songs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        id: ${{ fromJSON(needs.fetch.outputs.ids) }}
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: FFmpeg (static build with libass + x264)
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: mezmur-models-v3-${{ inputs.separator || 'vocals_mel_band_roformer.ckpt' }}
          restore-keys: mezmur-models-v3-
      - name: Install
        run: |
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[render]'
      - uses: actions/download-artifact@v4
        with:
          name: inputs-${{ github.run_id }}
          path: inputs
      - name: Make video, lyrics, thumbnails and upload kit
        shell: bash
        run: |
          out="output/song-${{ matrix.id }}"; mkdir -p "$out"
          set +e
          python -m mezmur.song --input "inputs/song-${{ matrix.id }}" --output "$out" \
            --work ".runtime/work" --separator "${{ inputs.separator || 'vocals_mel_band_roformer.ckpt' }}" \
            --height "${{ inputs.resolution || '1080' }}" 2>&1 | tee "$out/run.log"
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            echo "::error title=Song ${{ matrix.id }} failed::$(tail -n 12 "$out/run.log" | tr '\n' ' ' | cut -c1-900)"
          fi
          exit $code
      - name: Summary
        if: always()
        run: python -m mezmur.summary "output/song-${{ matrix.id }}" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mezmur-${{ matrix.id }}-run${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: bg-${{ matrix.id }}-${{ github.run_id }}
          path: output/song-${{ matrix.id }}/backgrounds.json
          retention-days: 2

  finalize:
    name: Save progress
    needs: [fetch, song]
    if: success() && needs.fetch.outputs.has_songs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install requests PyYAML
      - uses: actions/download-artifact@v4
        with:
          name: inputs-${{ github.run_id }}
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: bg-*-${{ github.run_id }}
          path: bg
      - name: Record completed batch
        run: python -m mezmur.finalize --plan inputs/plan.json --backgrounds bg
      - name: Where are my files?
        run: |
          echo "### Download each song from this run's **Artifacts** (mezmur-<message id>-run…)" >> "$GITHUB_STEP_SUMMARY"
          echo "Inside: video.mp4, thumbnail.jpg (+ -b, -c), title.txt, description.txt, tags.txt, captions/, UPLOAD.md" >> "$GITHUB_STEP_SUMMARY"
